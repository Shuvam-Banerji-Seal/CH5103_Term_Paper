<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig for rsvg-convert: system fonts + the TeX Live fonts used by the slides -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/usr/share/texmf-dist/fonts/opentype/public/libertinus-fonts</dir>
  <dir>/usr/share/texmf-dist/fonts/opentype/public/ebgaramond</dir>
</fontconfig>
